name: 4gauteauOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'crosshatch'
        type: choice
        options:
          - crosshatch
          - bonito
          - coral
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
          - eng

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours max

    strategy:
      matrix:
        device: [crosshatch, bonito, coral]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: manifests

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
          x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python3 python3-pip python3-venv \
          repo rsync schedtool ccache libssl-dev liblz4-tool \
          libxml2-utils lzma lzop m4 libtinfo5 libncurses5-dev \
          libncursesw5-dev libreadline-dev libgmp-dev libmpfr-dev \
          libmpc-dev zip unzip zstd openjdk-11-jdk

    - name: Set up Git
      run: |
        git config --global user.name "4gauteauOS CI"
        git config --global user.email "ci@4gauteauos.com"

    - name: Set up repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Set up ccache
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_DIR=~/ccache
        ccache -M 50G
        echo "CCACHE_DIR=$HOME/ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV

    - name: Initialize workspace
      run: |
        mkdir -p ~/4gauteauOS
        cd ~/4gauteauOS
        repo init -u https://github.com/ether4o4/4gauteauOS-manifests -b main -m default.xml

    - name: Sync source code
      run: |
        cd ~/4gauteauOS
        repo sync -c -j4 --no-tags --no-clone-bundle --fail-fast
      timeout-minutes: 180  # 3 hours max for sync

    - name: Set up build environment
      run: |
        cd ~/4gauteauOS
        source build/envsetup.sh
        lunch aosp_${{ matrix.device }}-userdebug

    - name: Build ROM
      run: |
        cd ~/4gauteauOS
        source build/envsetup.sh
        lunch aosp_${{ matrix.device }}-userdebug
        m -j$(nproc) 2>&1 | tee build.log
      timeout-minutes: 240  # 4 hours max for build

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: 4gauteauOS-${{ matrix.device }}
        path: |
          ~/4gauteauOS/out/target/product/${{ matrix.device }}/*.img
          ~/4gauteauOS/out/target/product/${{ matrix.device }}/*.zip
          ~/4gauteauOS/out/target/product/${{ matrix.device }}/*.md5sum
        retention-days: 7

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.device }}
        path: ~/4gauteauOS/build.log
        retention-days: 7

    - name: Upload ccache stats
      if: always()
      run: |
        ccache -s
      shell: bash

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        keep_files: false